name: Docker CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md' # Ignore markdown changes
      - 'LICENSE'
      - '.gitattributes'
      - '.gitignore'
  release:
    types:
      - published

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PLATFORMS: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7,linux/386

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.x # Use the version specified in go.mod or a compatible one

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get current version
      id: get_version
      shell: bash
      run: |
        # Extract version from go.mod
        GO_MOD_VERSION=$(grep -oP 'go \K[0-9]+\.[0-9]+' go.mod)
        echo "GO_MOD_VERSION=$GO_MOD_VERSION" >> $GITHUB_ENV
        
        # Get latest release tag from upstream repository to derive base version for Docker image
        LAST_RELEASE_TAG=$(git ls-remote --tags https://github.com/XIU2/CloudflareSpeedTest.git | awk -F/ '{print $3}' | grep -v '\^{}' | sort -V | tail -n 1 || echo "v0.0.0")
        echo "LAST_RELEASE_TAG=$LAST_RELEASE_TAG" >> $GITHUB_ENV

        # Convert repo name to lowercase for Docker tag
        REPO_LOWER="${GITHUB_REPOSITORY,,}"

        if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$LAST_RELEASE_TAG"
          fi

          DOCKER_IMAGE_VERSION=$(echo "$RELEASE_TAG" | sed 's/^v//')
          echo "APP_VERSION=$RELEASE_TAG" >> $GITHUB_ENV
          echo "IMAGE_TAG=ghcr.io/${REPO_LOWER}:${DOCKER_IMAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "CHANNEL_TAG=ghcr.io/${REPO_LOWER}:latest" >> $GITHUB_OUTPUT
        else
          DOCKER_IMAGE_VERSION=$(echo "$LAST_RELEASE_TAG" | sed 's/^v//')-pre.${{ github.run_number }}
          echo "APP_VERSION=$LAST_RELEASE_TAG" >> $GITHUB_ENV
          echo "IMAGE_TAG=ghcr.io/${REPO_LOWER}:${DOCKER_IMAGE_VERSION}" >> $GITHUB_OUTPUT
          echo "CHANNEL_TAG=ghcr.io/${REPO_LOWER}:pre" >> $GITHUB_OUTPUT
        fi

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: ${{ env.PLATFORMS }}
        outputs: >-
          type=image,"name=${{ steps.get_version.outputs.IMAGE_TAG }},${{ steps.get_version.outputs.CHANNEL_TAG }}",push=true,
          annotation-index.org.opencontainers.image.title=CloudflareSpeedTest Docker,
          annotation-index.org.opencontainers.image.description=CloudflareSpeedTest CLI container for latency/download testing.,
          annotation-index.org.opencontainers.image.source=https://github.com/${{ github.repository }},
          annotation-index.org.opencontainers.image.url=https://github.com/${{ github.repository }},
          annotation-index.org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme,
          annotation-index.org.opencontainers.image.licenses=GPL-3.0,
          annotation-manifest.org.opencontainers.image.title=CloudflareSpeedTest Docker,
          annotation-manifest.org.opencontainers.image.description=CloudflareSpeedTest CLI container for latency/download testing.,
          annotation-manifest.org.opencontainers.image.source=https://github.com/${{ github.repository }},
          annotation-manifest.org.opencontainers.image.url=https://github.com/${{ github.repository }},
          annotation-manifest.org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme,
          annotation-manifest.org.opencontainers.image.licenses=GPL-3.0
        build-args: |
          VERSION=${{ env.APP_VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
