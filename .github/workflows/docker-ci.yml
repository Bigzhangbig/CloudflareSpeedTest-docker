name: Docker CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md' # Ignore markdown changes
      - 'LICENSE'
      - '.gitattributes'
      - '.gitignore'

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PLATFORMS: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7,linux/386

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.x # Use the version specified in go.mod or a compatible one

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: all

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get current version
      id: get_version
      shell: bash
      run: |
        # Extract version from go.mod
        GO_MOD_VERSION=$(grep -oP 'go \K[0-9]+\.[0-9]+' go.mod)
        echo "GO_MOD_VERSION=$GO_MOD_VERSION" >> $GITHUB_ENV
        
        # Get latest release tag from upstream repository to derive base version for Docker image
        LAST_RELEASE_TAG=$(git ls-remote --tags https://github.com/XIU2/CloudflareSpeedTest.git | awk -F/ '{print $3}' | grep -v '\^{}' | sort -V | tail -n 1 || echo "v0.0.0")
        echo "LAST_RELEASE_TAG=$LAST_RELEASE_TAG" >> $GITHUB_ENV
        
        # Increment build number based on current CI run ID or simple counter
        BUILD_NUMBER=${{ github.run_number }}
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
        
        # Construct Docker image version: vX.X.X-YY (where X.X.X from last release, YY is build number)
        # Assuming main.version is like v1.2.3, we take v1.2.3-BUILD_NUMBER
        DOCKER_IMAGE_VERSION=$(echo "$LAST_RELEASE_TAG" | sed 's/^v//')-${{ github.run_number }}
        echo "DOCKER_IMAGE_VERSION=$DOCKER_IMAGE_VERSION" >> $GITHUB_ENV
        
        # Convert repo name to lowercase for Docker tag
        REPO_LOWER="${GITHUB_REPOSITORY,,}"
        
        # Set output for image tag
        echo "IMAGE_TAG=ghcr.io/${REPO_LOWER}:${DOCKER_IMAGE_VERSION}" >> $GITHUB_OUTPUT
        echo "LATEST_TAG=ghcr.io/${REPO_LOWER}:latest" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        platforms: ${{ env.PLATFORMS }}
        tags: |
          ${{ steps.get_version.outputs.IMAGE_TAG }}
          ${{ steps.get_version.outputs.LATEST_TAG }}
        build-args: |
          VERSION=${{ env.LAST_RELEASE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
